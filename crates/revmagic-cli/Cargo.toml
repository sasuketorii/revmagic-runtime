[package]
name = "revmagic-cli"
version = "0.2.7"
description = "desktop host-independent CLI for RevMagic (deterministic smoke + MCP foundation)"
edition = "2021"
rust-version = "1.86.0"
license = "MIT"
repository = "https://github.com/sasuketorii/revmagic-runtime.git"

[[bin]]
name = "revmagic-cli"
path = "src/main.rs"

[dependencies]
revmagic-core = { path = "../revmagic-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"
